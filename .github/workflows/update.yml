name: 更新 TVBox 源

on:
  schedule:
    # 每天 20:17 UTC = 北京时间次日 04:17 执行
    - cron: '17 20 * * *'
  workflow_dispatch:        # 支持手动触发
  push:
    paths:
      - 'sources.txt'
      - 'update.py'
      - 'spider/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: tvbox-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验干净爬虫 JAR
        run: |
          cd spider
          md5sum -c custom_spider.jar.md5

      - name: 生成源
        env:
          # 可选: 在仓库 Settings -> Secrets 里配置 CF_PROXY 以突破海外IP封锁
          CF_PROXY: ${{ secrets.CF_PROXY }}
          MAX_SOURCES: '300'
          MAX_COLLECT: '80'
          # 指向本仓库自带的干净 CatVodSpider JAR（无扫码/广告激活）
          SPIDER_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/spider/custom_spider.jar
          # 国内代理前缀，用于 *_cn.json 变体
          PROXY_PREFIX: https://gh-proxy.com/
        run: python3 update.py

      - name: 校验生成结果（默认 raw + 国内代理版 / 无扫码广告）
        env:
          EXPECTED_SPIDER: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/spider/custom_spider.jar
          PROXY_PREFIX: https://gh-proxy.com/
        run: |
          python3 - <<'PY'
          import json, os, sys

          EXPECTED = os.environ["EXPECTED_SPIDER"]
          PROXY = os.environ["PROXY_PREFIX"].rstrip("/") + "/"
          FORBIDDEN_DOMAINS = ("clbug.com", "moji.com", "wexguard")
          FORBIDDEN_WORDS = ("扫码", "看广告", "广告解锁", "激活", "卡密",
                             "付费", "收费", "打赏", "公众号", "加群")
          ADULT_MARKERS = ("🔞", "18+", "成人", "番号", "麻豆", "天美",
                           "果冻传媒", "星空传媒", "精东", "porn", "pron",
                           "jable", "javdb", "hanime", "91porn", "色播",
                           "肉视频", "女优", "clun.top")
          problems = []

          def load(name):
              with open(name, encoding="utf-8") as f:
                  return json.load(f)

          def check_sites(name, d, allowed_types):
              for s in d.get("sites", []):
                  if s.get("type") not in allowed_types:
                      problems.append(f"{name}: 站点 {s.get('key')!r} type={s.get('type')}")
                  blob = json.dumps(s, ensure_ascii=False).lower()
                  if any(w.lower() in blob for w in FORBIDDEN_WORDS):
                      problems.append(f"{name}: 站点 {s.get('key')!r} 命中广告关键字")
                  if any(x in blob for x in FORBIDDEN_DOMAINS):
                      problems.append(f"{name}: 站点 {s.get('key')!r} 使用广告/加固域名")
              for p in d.get("parses", []):
                  if any(x in json.dumps(p, ensure_ascii=False).lower() for x in FORBIDDEN_DOMAINS):
                      problems.append(f"{name}: 解析 {p.get('name')!r} 使用广告域名")

          def check_nonadult(name, d):
              for kind, items in (("站点", d.get("sites", [])),
                                  ("直播", d.get("lives", [])),
                                  ("解析", d.get("parses", []))):
                  for item in items:
                      blob = json.dumps(item, ensure_ascii=False).lower()
                      if any(m.lower() in blob for m in ADULT_MARKERS):
                          label = item.get("key") or item.get("name") or "?"
                          problems.append(f"{name}: 成人{kind}混入 {label!r}")

          status = load("status.json")
          expected_cn = status.get("spider_cn", "")
          if status.get("spider") != EXPECTED:
              problems.append(f"status.json: spider 不是本仓库干净 JAR -> {status.get('spider')!r}")
          if not expected_cn:
              problems.append("status.json: 缺少 spider_cn")
          if status.get("proxy_prefix") != PROXY:
              problems.append(f"status.json: proxy_prefix 不一致 -> {status.get('proxy_prefix')!r}")
          status_cn = load("status_cn.json")
          if status_cn.get("spider") != expected_cn:
              problems.append(f"status_cn.json: spider 未走国内代理 -> {status_cn.get('spider')!r}")

          for name in ("tvbox.json", "tvbox_cn.json"):
              d = load(name)
              if d.get("spider"):
                  problems.append(f"{name}: 简洁版不应带 spider -> {d.get('spider')!r}")
              check_sites(name, d, (0, 1))

          for name in ("tvbox_full.json", "tvbox_nonadult.json", "tvbox_adult.json"):
              d = load(name)
              if d.get("spider") != EXPECTED:
                  problems.append(f"{name}: spider 不是本仓库干净 JAR -> {d.get('spider')!r}")
              check_sites(name, d, (0, 1, 3, 4))

          for name in ("tvbox_full_cn.json", "tvbox_nonadult_cn.json", "tvbox_adult_cn.json"):
              d = load(name)
              if d.get("spider") != expected_cn:
                  problems.append(f"{name}: spider 未走国内代理 -> {d.get('spider')!r}")
              check_sites(name, d, (0, 1, 3, 4))

          for name in ("tvbox_nonadult.json", "tvbox_nonadult_cn.json"):
              check_nonadult(name, load(name))

          multi = load("tvbox_multi.json")
          for repo in multi.get("storeHouse", []):
              url = str(repo.get("sourceUrl", "")).lower()
              if any(x in url for x in FORBIDDEN_DOMAINS):
                  problems.append(f"tvbox_multi.json: 广告仓库 {url}")

          multi_cn = load("tvbox_multi_cn.json")
          cn_names = ("tvbox_full_cn.json", "tvbox_nonadult_cn.json",
                      "tvbox_adult_cn.json", "tvbox_cn.json")
          repos = multi_cn.get("storeHouse", [])
          if len(repos) < 4:
              problems.append("tvbox_multi_cn.json: 少于 4 个入口")
          for repo, suffix in zip(repos[:4], cn_names):
              url = str(repo.get("sourceUrl", ""))
              if not url.endswith(suffix):
                  problems.append(f"tvbox_multi_cn.json: 入口不是 {suffix} -> {url}")
              if not url.startswith(PROXY):
                  problems.append(f"tvbox_multi_cn.json: 未走代理 -> {url}")

          if problems:
              print("\n".join(problems))
              sys.exit("校验失败，拒绝提交")
          print("校验通过：raw + 国内代理版全部正常，无扫码广告")
          PY

      - name: 提交并推送
        run: |
          git config user.name  "tvbox-bot"
          git config user.email "tvbox-bot@users.noreply.github.com"
          git add tvbox.json tvbox_full.json tvbox_nonadult.json tvbox_adult.json tvbox_multi.json \
                  tvbox_cn.json tvbox_full_cn.json tvbox_nonadult_cn.json tvbox_adult_cn.json \
                  tvbox_multi_cn.json status.json status_cn.json index.html
          if git diff --cached --quiet; then
            echo "本次无变更"
            exit 0
          fi
          git commit -m "chore: 自动更新源 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:${{ github.ref_name }}
