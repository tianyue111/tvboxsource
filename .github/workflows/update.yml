name: 更新 TVBox 源

on:
  schedule:
    # 每天 20:17 UTC = 北京时间次日 04:17 执行
    - cron: '17 20 * * *'
  workflow_dispatch:        # 支持手动触发
  push:
    paths:
      - 'sources.txt'
      - 'update.py'
      - 'spider/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: tvbox-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验干净爬虫 JAR
        run: |
          cd spider
          md5sum -c custom_spider.jar.md5

      - name: 生成源
        env:
          # 可选: 在仓库 Settings -> Secrets 里配置 CF_PROXY 以突破海外IP封锁
          CF_PROXY: ${{ secrets.CF_PROXY }}
          MAX_SOURCES: '300'
          MAX_COLLECT: '80'
          # 指向本仓库自带的干净 CatVodSpider JAR（无扫码/广告激活）
          SPIDER_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/spider/custom_spider.jar
        run: python3 update.py

      - name: 校验生成结果（爬虫必须是干净 JAR / 无扫码广告）
        env:
          EXPECTED_SPIDER: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/spider/custom_spider.jar
        run: |
          python3 - <<'PY'
          import json, os, sys

          EXPECTED = os.environ["EXPECTED_SPIDER"]
          FORBIDDEN_DOMAINS = ("clbug.com", "moji.com", "wexguard")
          FORBIDDEN_WORDS = ("扫码", "看广告", "广告解锁", "激活", "卡密",
                             "付费", "收费", "打赏", "公众号", "加群")
          problems = []

          def check_sites(name, sites, allowed_types):
              for s in sites:
                  if s.get("type") not in allowed_types:
                      problems.append(f"{name}: 站点 {s.get('key')!r} type={s.get('type')}")
                  blob = json.dumps(s, ensure_ascii=False).lower()
                  if any(w.lower() in blob for w in FORBIDDEN_WORDS):
                      problems.append(f"{name}: 站点 {s.get('key')!r} 命中广告关键字")
                  if any(x in blob for x in FORBIDDEN_DOMAINS):
                      problems.append(f"{name}: 站点 {s.get('key')!r} 使用广告/加固域名")

          with open("tvbox.json", encoding="utf-8") as f:
              simple = json.load(f)
          if simple.get("spider"):
              problems.append(f"tvbox.json: 简洁版不应带 spider -> {simple.get('spider')!r}")
          check_sites("tvbox.json", simple.get("sites", []), (0, 1))

          with open("tvbox_full.json", encoding="utf-8") as f:
              full = json.load(f)
          if full.get("spider") != EXPECTED:
              problems.append(f"tvbox_full.json: spider 不是本仓库干净 JAR -> {full.get('spider')!r}")
          check_sites("tvbox_full.json", full.get("sites", []), (0, 1, 3, 4))
          for p in full.get("parses", []):
              if any(x in json.dumps(p, ensure_ascii=False).lower() for x in FORBIDDEN_DOMAINS):
                  problems.append(f"tvbox_full.json: 解析 {p.get('name')!r} 使用广告域名")

          with open("status.json", encoding="utf-8") as f:
              status = json.load(f)
          if status.get("spider") != EXPECTED:
              problems.append(f"status.json: spider 不是本仓库干净 JAR -> {status.get('spider')!r}")

          with open("tvbox_multi.json", encoding="utf-8") as f:
              multi = json.load(f)
          for repo in multi.get("storeHouse", []):
              url = str(repo.get("sourceUrl", "")).lower()
              if any(x in url for x in FORBIDDEN_DOMAINS):
                  problems.append(f"tvbox_multi.json: 广告仓库 {url}")

          if problems:
              print("\n".join(problems))
              sys.exit("校验失败，拒绝提交")
          print("校验通过：spider 指向本仓库干净 JAR，保留 type 0/1/3/4，无扫码广告")
          PY

      - name: 提交并推送
        run: |
          git config user.name  "tvbox-bot"
          git config user.email "tvbox-bot@users.noreply.github.com"
          git add tvbox.json tvbox_full.json tvbox_multi.json status.json index.html
          if git diff --cached --quiet; then
            echo "本次无变更"
            exit 0
          fi
          git commit -m "chore: 自动更新源 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:${{ github.ref_name }}
